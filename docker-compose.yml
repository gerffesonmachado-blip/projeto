version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    container_name: biblioteca_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: biblioteca_escolar
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: